<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>06自定义JS对象</title>
</head>
<body>

    <table border="1px">
        <caption>商品表</caption>
        <tr>
            <th>商品名称</th>
            <th>商品价格</th>
            <th>商品库存</th>
        </tr>
    </table>
    <script>
        let p1 = {
            name: '张三',
            age: 18,
            say: function() {
                console.log("我是" + this.name + ",今年" + this.age + "岁了!");
            }
        };

        let p2 = {};
        p2.name = "王五";
        p2.age = 10;
        p2.say = function() {
            console.log("他是" + this.name + ",今年" + this.age + "岁了!");
        }
        console.log(p2);
        p2.say();

        let  productArr = [
            {title:'小米', price: 9000, num: 700},
            {title:'华为', price: 7800, num: 900},
            {title:'苹果', price: 7609, num: 300}
        ];
        console.log(productArr.length);
        let tr = document.createElement("tr");
        let table = document.querySelector("table");

        for (let i = 0; i < productArr.length; i++) {
            let tr = document.createElement("tr");       // 新的 tr
            let nameTd = document.createElement("td");   // 新的 td
            let priceTd = document.createElement("td");
            let numTd = document.createElement("td");

            nameTd.textContent = productArr[i].title;
            priceTd.textContent = productArr[i].price;
            numTd.textContent = productArr[i].num;

            tr.append(nameTd, priceTd, numTd);
            table.append(tr); // 每次 append 的都是不同的 tr 实例
        }
    </script>

</body>
</html>
