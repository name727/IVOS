<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>04猜数字游戏</title>
</head>
<body>
    <h3>已生成一个1~100的随机整数:</h3>
    <input type="text" placeholder="请输入您猜的数字!" id="i1">
    <button onclick="guess()">点我验证</button>
    <h3>小提示: <span></span></h3>

    <script>
        let n = parseInt(Math.random()*100)+1;
        let count = 0
        console.log('打个小抄' + n);

        function guess() {
            let input = document.getElementById('i1').value;
            if (isNaN(input)) {
                alert('请输入数字');
                return;
            }
            let span = document.querySelector('span');
            input = parseFloat(input);
            count++;
            if (input > n) {
                span.innerText = '猜大了！';
            } else if (input < n) {
                span.innerText = '猜小了';
            } else {
                span.innerText = '恭喜您用了' + count + '次就猜对了!';
            }
        }
    </script>
</body>
</html>
